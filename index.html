<script id="decision-engine">
'use strict';
(function(root){
  const VERSION = '1.1.0';
  const SOURCE_DATE = '2026-05-15';
  const THRESHOLD = 1.5;
  const DRUG_CLASS = Object.freeze({semaglutide_sc:'long',semaglutide_po:'long',dulaglutide:'long',tirzepatide:'long',liraglutide:'short',lixisenatide:'short'});

  // General fasting is a reference, never a clearance decision or an emergency waiting rule.
  // Numeric intervals refer to healthy elective patients; see source-specific qualifications in UI.
  const FASTING_REFERENCE = Object.freeze({
    adult:Object.freeze({clear:2,lightMeal:6,nonhumanMilk:6,fattyMealAtLeast:8}),
    pediatricESAIC2022:Object.freeze({clear:1,breastMilk:3,infantFormula:4,infantNonhumanMilk:4,solids:6,fattyMealAtLeast:null,formulaScope:'infants',formulaStrength:'suggestion-2B'}),
    pediatricASA2017:Object.freeze({clear:2,breastMilk:4,infantFormula:6,nonhumanMilk:6,lightMeal:6,fattyMealAtLeast:8})
  });
  function referenceKind(code){
    return code==='not_exposed'?'routine':code==='outside'?'emergency':code==='therapy_stopped'?'discontinued':null;
  }
  const emptyScan = () => ({content:'',grade:'',unit:'indexed',volume:'',weight:''});
  const initialState = () => ({mode:'plan',elective:'',exposure:'',plan:{therapy:'',drug:'',protocol:'',risks:[],reviewed:false,stable:''},day:{pocus:'',prep:'',medication:'',scan:emptyScan(),canDelay:'',repeated:'',repeat:emptyScan()}});
  // Comma OR period accepted as the decimal separator. Grouping, exponent notation,
  // mixed separators, negatives, Infinity, and partial parses are rejected.
  function number(raw){
    const value=String(raw??'').trim();
    if(!/^(?:\d+(?:[.,]\d+)?|[.,]\d+)$/.test(value))return null;
    const n=Number(value.replace(',','.'));
    return Number.isFinite(n)&&n>=0?n:null;
  }
  function classify(scan){
    if(!scan||!scan.content)return {kind:'pending'};
    if(scan.content==='solid')return {kind:'high',why:'solid'};
    if(scan.content==='empty')return {kind:'low',why:'empty'};
    if(scan.content==='uncertain')return {kind:'indeterminate'};
    if(scan.content!=='liquid')return {kind:'invalid'};
    if(!String(scan.volume??'').trim())return {kind:'pending'};
    const entered=number(scan.volume);
    if(entered===null)return {kind:'invalid'};
    let volume=entered;
    if(scan.unit==='absolute'){
      if(!String(scan.weight??'').trim())return {kind:'pending'};
      const weight=number(scan.weight);
      if(weight===null||weight<=0)return {kind:'invalid'};
      volume=entered/weight;
    }else if(scan.unit!=='indexed')return {kind:'invalid'};
    if(!Number.isFinite(volume))return {kind:'invalid'};
    // No rounding before comparison. 1.50 is low by the figure, 1.5001 is high.
    if(volume>THRESHOLD)return {kind:'high',why:'volume',volume};
    // Figure requires BOTH Perlas 0–1 and <=1.5 mL/kg with no solids.
    // A low numerical estimate with grade 2 is not silently relabelled low risk.
    if(scan.grade==='2')return {kind:'discordant',volume};
    if(scan.grade==='1')return {kind:'low',why:'liquid',volume};
    if(scan.grade==='unknown')return {kind:'indeterminate',volume};
    if(!scan.grade)return {kind:'pending',volume};
    return {kind:'invalid'};
  }
  function evaluate(s){
    const path=[];
    const out=(code,extra={})=>({code,path:[...path],...extra});
    if(!s.elective)return out('scope_pending');
    if(s.elective==='no')return out('outside');
    if(s.elective!=='yes')return out('scope_unknown');
    path.push('elective');
    if(!s.exposure)return out('exposure_pending');
    if(s.exposure==='no')return out('not_exposed');
    if(s.exposure!=='yes')return out('exposure_unknown');
    path.push('exposed');
    if(s.mode==='plan'){
      const p=s.plan;
      if(!p.therapy)return out('therapy_pending');
      if(p.therapy==='stopped')return out('therapy_stopped');
      if(p.therapy!=='on')return out('therapy_unknown');
      if(!p.drug)return out('drug_pending');
      const drugClass=DRUG_CLASS[p.drug];
      if(!drugClass)return out('drug_unknown');
      if(!p.protocol)return out('protocol_pending');
      if(!['yes','no'].includes(p.protocol))return out('protocol_unknown');
      path.push(p.protocol==='yes'?'protocol_yes':'protocol_no');
      const hasRisk=p.risks.length>0 || p.stable==='no';
      if(hasRisk)path.push('risk_present');
      // Figure skips screening when no ultrasound pathway exists. We ask it also for
      // short-acting drugs, to detect the unresolved conflict with item 5 on page 4.
      if(p.protocol==='no'&&drugClass==='long')return out('hold7',{drugClass});
      if(!hasRisk&&!p.reviewed)return out('risk_pending');
      if(p.protocol==='no'){
        if(hasRisk)return out('short_conflict',{drugClass});
        path.push('risks_absent');return out('hold1',{drugClass});
      }
      if(hasRisk)return out(drugClass==='short'?'short_conflict':'hold7',{drugClass});
      path.push('risks_absent');
      if(!p.stable)return out('stable_pending');
      if(p.stable!=='yes')return out('stable_unknown');
      path.push('stable');return out('continue',{drugClass});
    }
    if(s.mode!=='day')return out('scope_unknown');
    const d=s.day;
    if(!d.pocus)return out('pocus_pending');
    if(!['yes','no'].includes(d.pocus))return out('pocus_unknown');
    if(d.pocus==='no'){
      path.push('pocus_no');
      if(!d.prep)return out('prep_pending');
      if(d.prep==='no'){path.push('prep_no');return out('postpone_prep');}
      if(d.prep!=='yes')return out('prep_unknown');
      path.push('prep_yes');
      // Explicit SOFTWARE safeguard: page 9 does not resolve unexpected loss of
      // POCUS after continuation / an unfulfilled withholding plan. Item 3.3 matters.
      if(!d.medication)return out('medication_pending');
      if(d.medication!=='held')return out('medication_review');
      path.push('hold_confirmed');return out('caution_no_scan');
    }
    path.push('pocus_yes');
    const first=classify(d.scan);
    if(first.kind==='pending')return out('scan_pending',{scan:first});
    if(first.kind==='invalid')return out('scan_invalid',{scan:first});
    if(first.kind==='indeterminate')return out('scan_indeterminate',{scan:first});
    if(first.kind==='discordant')return out('scan_discordant',{scan:first});
    if(first.kind==='low'){path.push('first_low');return out('proceed',{scan:first});}
    path.push(first.why==='solid'?'first_solid':'first_high_volume');
    if(!d.canDelay)return out('delay_pending',{scan:first});
    if(d.canDelay==='yes'){path.push('delay_yes');return out('postpone_high',{scan:first});}
    if(d.canDelay!=='no')return out('delay_unknown',{scan:first});
    path.push('delay_no');
    if(d.repeated!=='yes')return out('prokinetic',{scan:first});
    const repeat=classify(d.repeat);
    if(repeat.kind==='pending')return out('repeat_pending',{scan:first,repeat});
    if(repeat.kind==='invalid')return out('repeat_invalid',{scan:first,repeat});
    if(['indeterminate','discordant'].includes(repeat.kind))return out('repeat_uncertain',{scan:first,repeat});
    if(repeat.kind==='low'){path.push('repeat_low');return out('caution_repeat',{scan:first,repeat});}
    path.push('repeat_high');return out('full_stomach',{scan:first,repeat});
  }
  // Immutable update. Clear dependent answers when an upstream finding changes.
  function transition(state,key,value){
    const s=JSON.parse(JSON.stringify(state));
    if(key==='mode'){s.mode=value;return s;}
    if(key==='elective'||key==='exposure'){
      if(s[key]===value)return s;
      const fresh=initialState();fresh.mode=s.mode;fresh.elective=s.elective;fresh.exposure=s.exposure;fresh[key]=value;return fresh;
    }
    if(key.startsWith('risk:')){
      // Planning edits invalidate on-the-day confirmations, not just their display.
      // These are two different clinical moments; the plan never fills today's answers.
      s.day=initialState().day;
      const risk=key.slice(5);s.plan.risks=value?[...new Set([...s.plan.risks,risk])]:s.plan.risks.filter(x=>x!==risk);
      s.plan.reviewed=false;s.plan.stable='';return s;
    }
    if(key.startsWith('plan.')){
      const field=key.split('.')[1];
      if(s.plan[field]===value)return s;
      // The combined negative review includes stability and absence of symptoms.
      // A positive risk cannot be erased by activating the 'none' control.
      if(field==='reviewed'&&value&&s.plan.risks.length)return s;
      s.day=initialState().day;
      s.plan[field]=value;
      if(field==='reviewed')s.plan.stable=value?'yes':'';
      if(field==='therapy'&&value!=='on'){s.plan.drug='';s.plan.protocol='';s.plan.risks=[];s.plan.reviewed=false;s.plan.stable='';}
      if(field==='protocol'){s.plan.risks=[];s.plan.reviewed=false;s.plan.stable='';}
      if(field==='reviewed'&&!value)s.plan.stable='';
      return s;
    }
    const parts=key.split('.');
    if(parts[0]!=='day')return s;
    if(parts.length===3){
      const which=parts[1],field=parts[2];if(s.day[which][field]===value)return s;s.day[which][field]=value;
      if(field==='content')s.day[which]={...emptyScan(),content:value};
      if(field==='unit'){s.day[which].volume='';s.day[which].weight='';}
      if(which==='scan'){s.day.canDelay='';s.day.repeated='';s.day.repeat=emptyScan();}
      return s;
    }
    const field=parts[1];
    if(s.day[field]===value)return s;
    if(field==='pocus'){s.day=initialState().day;s.day.pocus=value;return s;}
    s.day[field]=value;
    if(field==='prep')s.day.medication='';
    if(field==='canDelay'){s.day.repeated='';s.day.repeat=emptyScan();}
    if(field==='repeated')s.day.repeat=emptyScan();
    return s;
  }
  root.GLP1Engine=Object.freeze({VERSION,SOURCE_DATE,THRESHOLD,DRUG_CLASS,FASTING_REFERENCE,referenceKind,initialState,emptyScan,number,classify,evaluate,transition});
})(globalThis);
</script>

 caution_repeat:C(['Prosseguir com cautela','Proceed with caution'],['A reavaliação mostrou baixo risco após um POCUS inicial de alto risco. A seta da página 9 leva a “prosseguir com cautela”, não diretamente à técnica inicialmente planejada.','Repeat POCUS showed low risk after an initially high-risk scan. Page 9 points to “proceed with caution”, not directly to the initially planned technique.'],'warning',[9],ACTIONS.caution),

function prokineticDetails(){return `<details class="medical-details" id="prokinetic-details"><summary>${t('Eritromicina: orientação da figura (p. 9)','Erythromycin: guidance in the figure (p. 9)')}</summary><p><strong>${t('3 mg/kg EV, máximo 250 mg','3 mg/kg IV, maximum 250 mg')}</strong> ${t('em infusão lenta de 20–30 minutos; 1–2 h antes da indução. A figura também cita 15 minutos antes em “urgência absoluta”.','as a slow 20–30-minute infusion; 1–2 hours before induction. The figure also mentions 15 minutes before in “absolute urgency”.')}</p><p>${t('Conferir alergia a macrolídeos, QT longo, fármacos que prolongam QT, hepatopatia grave e interações medicamentosas (a figura cita estatinas e varfarina, entre outras).','Check macrolide allergy, prolonged QT, QT-prolonging drugs, severe liver disease and drug interactions (the figure lists statins and warfarin, among others).')}</p><p class="caution-copy">${t('Referência do documento, não prescrição automática. Este app não calcula dose, não agenda infusão e não extrapola o fluxo eletivo para urgências. A figura não resolve a compatibilidade entre a menção de 15 minutos e a duração da infusão.','Document reference, not an automatic prescription. This app does not calculate a dose, schedule an infusion or extend the elective pathway to emergencies. The figure does not resolve the relationship between its 15-minute mention and infusion duration.')}</p></details>`;}

function sourceDialog(){showDialog(`<div class="dialog-inner"><header class="dialog-head"><div><h2 id="dialogTitle">${t('Fonte, adaptações e limites','Source, adaptations and limitations')}</h2><p>C.SBA-01744/2026 · 15/05/2026</p></div><button type="button" class="btn small" data-action="close-dialog" aria-label="${t('Fechar','Close')}">${icon('x')}</button></header><p>${t('Base principal: fluxograma das páginas 8–9 da nota da Sociedade Brasileira de Anestesiologia. A verificação da fonte é manual; o app não atualiza recomendações automaticamente.','Primary basis: flowchart on pages 8–9 of the Brazilian Society of Anesthesiology note. Source review is manual; the app does not update recommendations automatically.')}</p><div class="source-links"><a class="btn small" href="${SOURCE}#page=8" target="_blank" rel="noopener noreferrer">${t('Página 8','Page 8')} ↗</a><a class="btn small" href="${SOURCE}#page=9" target="_blank" rel="noopener noreferrer">${t('Página 9','Page 9')} ↗</a><a class="btn small" href="${SOURCE_PAGE}" target="_blank" rel="noopener noreferrer">${t('Publicação da SBA','SBA publication')} ↗</a></div><h3>${t('O que foi preservado','What is preserved')}</h3><p>${t('Os dois momentos, os quatro grupos de fatores da figura, os ramos de manutenção/suspensão, o preparo, o limiar de 1,5 mL/kg e a distinção entre baixo risco inicial e baixo risco após reavaliação. Sem pontuação de risco ou estimador ultrassonográfico externo.','The two stages, the figure’s four risk-factor groups, continuation/withholding branches, preparation, the 1.5 mL/kg threshold and the distinction between initially low risk and low risk after reassessment. No risk score or external ultrasound estimator.')}</p><h3>${t('Complementos do próprio documento','Additions from the same document')}</h3><p>${t('Itens 3/3.3 (p. 3): estrutura de POCUS e condição para manutenção. Item 5 (p. 4): divergência do prazo em alto risco. Item 6.3 (p. 4): individualizar após descontinuação. Itens 7–9 (pp. 5–6): fatores adicionais, identificados separadamente no formulário.','Items 3/3.3 (p. 3): POCUS capability and continuation condition. Item 5 (p. 4): high-risk interval discrepancy. Item 6.3 (p. 4): individualization after discontinuation. Items 7–9 (pp. 5–6): additional factors, separately labeled in the form.')}</p><h3>${t('Salvaguardas de software — não novas diretrizes','Software safeguards — not new guidelines')}</h3><ul><li>${t('Não inferir respostas ausentes. Exigir confirmação explícita de nenhum fator, uso estável ≥ 12 semanas e ausência de sintomas. A confirmação fica indisponível enquanto houver algum fator assinalado.','Do not infer missing answers. Require explicit confirmation of no risk factors, stable use ≥ 12 weeks and no symptoms. This confirmation is unavailable while a risk factor is selected.')}</li><li>${t('Não resolver automaticamente a divergência de 1 dia versus pelo menos 7 dias em curta ação com alto risco.','Do not automatically resolve the 1-day versus at-least-7-days discrepancy in high-risk patients on short-acting therapy.')}</li><li>${t('POCUS inconclusivo ou grau 2 com volume ≤ 1,5 mL/kg não recebe classificação automática de baixo risco. Comparações usam o valor sem arredondamento.','Inconclusive POCUS or grade 2 with volume ≤ 1.5 mL/kg is not automatically classified as low risk. Comparisons use the unrounded value.')}</li><li>${t('Sem POCUS, mas com preparo cumprido, confirmar a suspensão planejada. Medicação mantida, suspensão descumprida ou plano desconhecido levam à revisão individual, pois essa combinação não está detalhada na p. 9.','Without POCUS but with preparation completed, confirm planned withholding. Continued medication, missed withholding or an unknown plan require individual review because this combination is not detailed on p. 9.')}</li><li>${t('Mudanças em respostas anteriores apagam dados dependentes. Editar o planejamento invalida as confirmações do dia; alternar as etapas não altera os dados. O planejamento nunca preenche automaticamente as respostas do dia. Sem calculadora de dose, relógio de suspensão ou prescrição automática.','Changes to upstream answers clear dependent data. Editing the plan invalidates on-the-day confirmations; switching stages preserves data. Planning never automatically fills on-the-day answers. No dose calculator, withholding clock or automatic prescription.')}</li></ul>${generalSourcesDetails()}<h3>${t('Limites para uso','Use limitations')}</h3><p>${t('Ferramenta independente de apoio profissional, sem vínculo ou endosso oficial da SBA e sem validação clínica independente documentada. O fluxo GLP-1 parte de cirurgia eletiva. Há tabelas de referência de jejum adulto e pediátrico, mas não um protocolo de liberação pediátrica, de urgência, de reinício pós-operatório ou de diabetes individual. A proteção de via aérea permanece sujeita ao julgamento clínico.','Independent professional decision-support tool, without official SBA affiliation or endorsement and without documented independent clinical validation. The GLP-1 pathway starts with elective surgery. Adult and pediatric fasting reference tables are included, but no pediatric clearance, emergency-management, postoperative-restart or individualized diabetes protocol is provided. Airway protection remains subject to clinical judgment.')}</p><p>${t('As respostas existem apenas na memória desta aba. A preferência de idioma usa localStorage. O código não envia respostas; o serviço que hospeda a página pode manter seus próprios registros de acesso. Links de fontes e GitHub abrem sites externos.','Answers exist only in this tab’s memory. Language preference uses localStorage. The code does not transmit answers; the hosting service may keep its own access logs. Source and GitHub links open external sites.')}</p><h3>${t('Autoria e manutenção','Authorship and maintenance')}</h3><p>${esc(MAINTAINER.name)} · <a href="mailto:${esc(MAINTAINER.email)}">${esc(MAINTAINER.email)}</a></p><p>${t('Código e documentação original sob licença MIT. As fontes clínicas e marcas de terceiros mantêm seus próprios direitos. A manutenção do software não representa responsabilidade pelo atendimento de um paciente.','Code and original documentation are licensed under MIT. External clinical sources and third-party marks retain their own rights. Software maintenance does not imply responsibility for a patient’s clinical care.')}</p><p><a href="${esc(MAINTAINER.githubUrl)}" target="_blank" rel="noopener noreferrer">GitHub ↗</a></p><p>v${E.VERSION} · ${t('Software: 14/09/2026 · SBA: 15/05/2026 · Jejum: ASA 2017 / ESA 2011 / ESAIC 2022 · Revisão clínica independente: não documentada','Software: 14 September 2026 · SBA: 15 May 2026 · Fasting: ASA 2017 / ESA 2011 / ESAIC 2022 · Independent clinical review: not documented')}</p></div>`);}

// A single negative review explicitly confirms all continuation prerequisites.
// No additional stability/symptom question is displayed or inferred from blank boxes.
const YN=()=>[['yes',t('Sim','Yes')],['no',t('Não','No')]];
const YNU=()=>[...YN(),['unknown',t('Não sei','Unknown')]];
const COMPLETED_PLAN=new Set(['continue','hold7','hold1','short_conflict','therapy_stopped']);
function get(key){return key.split('.').reduce((o,k)=>o?.[k],state);}
function format(n){return n.toLocaleString(lang==='pt'?'pt-BR':'en-US',{maximumFractionDigits:20,useGrouping:false});}
function drugName(value){const item=DRUGS.find(a=>a[0]===value);return item?t(item[1],item[2]):t('Não informado','Not entered');}
function hasPlan(){return !!(state.plan.therapy||state.plan.drug||state.plan.protocol||state.plan.reviewed||state.plan.risks.length);}
function hasDay(){return !!state.day.pocus;}
function hasAnswers(){return !!(state.elective||state.exposure||hasPlan()||hasDay());}
function planDecision(){return E.evaluate({...state,mode:'plan'});}

 asa2017:{label:'ASA 2017',url:'https://journals.lww.com/anesthesiology/fulltext/10.1097/aln.0000000000001452~practice-guidelines-for-preoperative-fasting-and-the-use-of',doi:'10.1097/ALN.0000000000001452'},
 esa2011:{label:'ESA 2011',url:'https://esaic.org/guideline/perioperative-fasting-in-adults-and-children/',doi:'10.1097/EJA.0b013e3283495ba1'},
 esaic2022:{label:'ESAIC 2022',url:'https://esaic.org/guideline/pre-operative-fasting-in-children/',doi:'10.1097/EJA.0000000000001599'}
});
function fastingLinks(){return ['asa2017','esa2011','esaic2022'].map(k=>{const a=FASTING_SOURCES[k];return `<a href="${a.url}" target="_blank" rel="noopener noreferrer">${a.label} ↗</a>`;}).join(' · ');}
function referenceScope(){return t('Referência para pacientes saudáveis em procedimentos eletivos, sem fatores que exijam manejo individual do risco de aspiração. Não comprova estômago vazio nem autoriza a anestesia.','Reference for healthy patients undergoing elective procedures, without factors requiring individualized aspiration-risk management. It does not establish an empty stomach or authorize anesthesia.');}
function referenceWarning(kind){
 if(kind==='emergency')return t('Urgência / emergência: os intervalos eletivos abaixo NÃO são um tempo obrigatório de espera. Não atrasar atendimento urgente apenas para completar esta tabela; individualizar a estratégia anestésica e de via aérea.','Urgent / emergency care: the elective intervals below are NOT a mandatory waiting period. Do not delay urgent care solely to complete this table; individualize anesthesia and airway strategy.');
 if(kind==='discontinued')return t('GLP-1 descontinuado: não há prazo definido nesta nota da SBA para abandonar o preparo específico. A tabela habitual é apenas referência e NÃO substitui automaticamente a dieta de 24 h e o plano individual.','GLP-1 discontinued: the SBA note specifies no interval at which its specific preparation can be abandoned. Routine fasting is a reference only and does NOT automatically replace the 24-hour diet and individual plan.');
 return '';
}
function fastingRows(population){
 const f=E.FASTING_REFERENCE;
 if(population==='adult')return [
  [t('Líquidos claros','Clear liquids'),`${f.adult.clear} h`],
  [t('Refeição leve / leite não humano','Light meal / nonhuman milk'),`${f.adult.lightMeal} h`],
  [t('Frituras, alimentos gordurosos ou carne','Fried foods, fatty foods or meat'),`≥ ${f.adult.fattyMealAtLeast} h*`]
 ];
 const e=f.pediatricESAIC2022,a=f.pediatricASA2017;
 return [
  [t('Líquidos claros','Clear liquids'),`${e.clear} h`,`${a.clear} h`],
  [t('Leite materno','Breast milk'),`${e.breastMilk} h`,`${a.breastMilk} h`],
  [t('Fórmula / leite não humano em lactentes','Formula / nonhuman milk in infants'),`${e.infantFormula} h*`,`${a.infantFormula} h`],
  [t('Sólidos / refeição leve','Solids / light meal'),`${e.solids} h`,`${a.lightMeal} h`],
  [t('Frituras, alimentos gordurosos ou carne','Fried foods, fatty foods or meat'),'—',`≥ ${a.fattyMealAtLeast} h†`]
 ];
}

function generalReferenceCard(r){

 sem leite. Leite, bebidas com gordura ou partículas e fórmulas nutricionais não são líquidos claros. Refeição leve: por exemplo, torrada com líquido claro.','Clear liquids in this reference: water, pulp-free juice, tea and coffee without milk. Milk, drinks containing fat or particles and nutritional formulas are not clear liquids. A light meal can be toast with a clear liquid.')}</p><p>${t('Gastroparesia, obstrução, disfagia, suspeita de retenção gástrica ou uso recente de medicamentos que retardam o esvaziamento exigem avaliação específica. Uma comorbidade isolada não implica automaticamente aumentar o jejum.','Gastroparesis, obstruction, dysphagia, suspected gastric retention or recent use of drugs that delay emptying require specific assessment. An isolated comorbidity does not automatically imply a longer fast.')}</p><p>${t('ESAIC 2022 inclui uma sugestão de café da manhã leve selecionado com 4 h (S12, 2C); não adotada como regra nesta tabela. A definição de líquidos da ESA 2011 admite pequena adição de leite ao chá/café, enquanto esta referência usa a definição sem leite da ASA 2017 / ESAIC 2022.','ESAIC 2022 includes a suggestion for a selected light breakfast with 4 hours (S12, 2C); this is not adopted as the default in this table. ESA 2011 permits a small milk addition to tea/coffee, whereas this reference uses the milk-free definition from ASA 2017 / ESAIC 2022.')}</p></details><p class="fasting-source">${fastingLinks()}</p></section>`;

function generalSourcesDetails(){return `<h3>${t('Referência de jejum habitual — fontes separadas','Routine fasting reference — separate sources')}</h3><p>${fastingLinks()}</p><p>${t('ASA 2017: pacientes saudáveis, procedimentos eletivos; 2 h para líquidos claros, 4 h leite materno, 6 h fórmula/leite não humano/refeição leve; 8 h ou mais podem ser necessárias para gordura ou carne. ESA 2011: diretriz histórica para adultos e crianças, com 2 h para líquidos e 6 h para sólidos. A data da página de hospedagem não muda o ano da diretriz.','ASA 2017: healthy patients, elective procedures; 2 hours for clear liquids, 4 for breast milk, 6 for formula/nonhuman milk/light meal; 8 hours or more may be needed for fatty foods or meat. ESA 2011: historical adult and pediatric guideline, with 2 hours for fluids and 6 for solids. The hosting page date does not change the guideline year.')}</p><p>${t('ESAIC 2022: recomendação pediátrica de líquidos claros 1 h (R2), leite materno 3 h (R8) e sólidos 6 h (R11); fórmula/leite não humano em lactentes 4 h é sugestão (S10, 2B). Não fundir esse esquema com os tempos ASA. S12 (café da manhã selecionado, 4 h) não vira regra automática.','ESAIC 2022: pediatric recommendations of clear liquids 1 hour (R2), breast milk 3 hours (R8) and solids 6 hours (R11); formula/nonhuman milk in infants at 4 hours is a suggestion (S10, 2B). Do not merge this scheme with ASA intervals. S12 (selected breakfast, 4 hours) is not made an automatic rule.')}</p><p>${t('As tabelas aparecem sem exposição informada ao GLP-1, em procedimentos não eletivos e após descontinuação do medicamento. Nos dois últimos casos, são apenas referência acompanhada de ressalva: não determinam liberação, atraso de urgência ou abandono do preparo da SBA. Respostas desconhecidas, POCUS inconclusivo ou descumprimento do preparo NÃO acionam jejum habitual.','Tables appear when no GLP-1 exposure is reported, for non-elective procedures and after drug discontinuation. In the latter two cases,     body+=`<div class="sub-card" id="repeat-confirmation">${radios('day.repeated',t('Já foi realizado um novo POCUS?','Has repeat POCUS been performed?'),[['no',t('Ainda não','Not yet')],['yes',t('Sim, registrar achado','Yes, record finding')]])}</div>`;

}
function prepCard(){return `<section class="card prep" id="prep-reference" aria-labelledby="prep-title"><header class="prep-head"><h3 id="prep-title">${t('Preparo do fluxograma','Flowchart preparation')}</h3><small>SBA 2026</small></header><div class="prep-times"><div class="prep-time"><strong>24 h</strong><span>${t('Dieta líquida<br>sem resíduos','Residue-free<br>liquid diet')}</span></div><div class="prep-time"><strong>8–12 h</strong><span>${t('Jejum absoluto<br>antes do procedimento','Complete fasting<br>before the procedure')}</span></div></div><p>${t('Nas 8–12 h finais, interromper a ingestão conforme o plano anestésico.','During the final 8–12 hours, stop intake according to the anesthetic plan.')}</p><details id="liquids-details"><summary>${t('Quais líquidos?','Which liquids?')}</summary><p>${t('Água, café preto sem leite, chá, água de coco sem resíduos, sucos coados sem polpa e bebidas sem resíduos contendo carboidratos ou soluções de reidratação oral.','Water, black coffee without milk, tea, residue-free coconut water, strained pulp-free juice and residue-free carbohydrate drinks or oral rehydration solutions.')}</p><p>${sourceLinks([9,4])}</p></details></section>`;}
function isPending(code){return code.endsWith('_pending');}
function isReview(code){return code.endsWith('_unknown')||code.endsWith('_invalid')||['short_conflict','medication_review','therapy_stopped','outside','scan_indeterminate','scan_discordant','repeat_uncertain','drug_unknown'].includes(code);}
function why(r){
 const p=state.plan,d=state.day,c=COPY[r.code];
 switch(r.code){
  case 'continue':return t('POCUS previsto, revisão negativa confirmada, uso estável ≥ 12 semanas e ausência de sintomas.','POCUS planned, negative review confirmed, stable use ≥ 12 weeks and no symptoms.');
  case 'hold7':return p.protocol==='no'?t('Medicamento de longa ação e ausência de protocolo institucional de POCUS.','Long-acting medication and no institutional POCUS pathway.'):t('Medicamento de longa ação com fator de risco ou instabilidade terapêutica.','Long-acting medication with a risk factor or unstable treatment.');
  case 'hold1':return t('Medicamento de curta ação, sem protocolo de POCUS e sem fatores de risco na revisão confirmada.','Short-acting medication, no POCUS pathway and no risk factors in the confirmed review.');
  case 'short_conflict':return t('Medicamento de curta ação com fator de risco ou instabilidade terapêutica.','Short-acting medication with a risk factor or unstable treatment.');
  case 'caution_no_scan':return t('POCUS indisponível. Preparo completo e cumprimento da suspensão planejada confirmados.','POCUS unavailable. Full preparation and completion of planned withholding confirmed.');
  case 'medication_review':return t('POCUS indisponível, com preparo cumprido, mas sem confirmação de suspensão conforme o plano.','POCUS unavailable with preparation completed, but withholding according to plan is not confirmed.');

function nodeKey(node){return node.nodeType===1?(node.id||node.getAttribute('data-key')||''):'';}

 for(const attr of [...newNode.attributes])if(oldNode.getAttribute(attr.name)!==attr.value)oldNode.setAttribute(attr.name,attr.value);
 if(oldNode.tagName==='INPUT'){
  if(oldNode.type==='checkbox'||oldNode.type==='radio')oldNode.checked=newNode.hasAttribute('checked');

 reconcileChildren(oldNode,newNode);
 if(oldNode.tagName==='SELECT'){

function reconcileChildren(parent,next){

 for(const fresh of incoming){

   else{parent.insertBefore(fresh.cloneNode(true),old||null);index++;continue;}

 $('app').hidden=true;$('printArea').innerHTML='';
 $('fatal').hidden=false;$('fatal').innerHTML='<strong>Não use o resultado desta avaliação. / Do not use this assessment’s result.</strong><p>Ocorreu um erro na interface. Recarregue a página para iniciar uma nova avaliação. / An interface error occurred. Reload to start a new assessment.</p><button class="btn" type="button" id="reload-app">Recarregar / Reload</button>';
 $('reload-app').addEventListener('click',()=>location.reload());
}
document.addEventListener('input',event=>{if(event.target.matches('input[type="text"][data-field]'))try{handleField(event);}catch(e){failSafe(e);}});
document.addEventListener('change',event=>{if(event.target.matches('[data-field]:not(input[type="text"])'))try{handleField(event);}catch(e){failSafe(e);}});
document.addEventListener('click',event=>{
 const control=event.target.closest('[data-action]');if(!control)return;
 try{
  switch(control.dataset.action){
   case 'language':lang=lang==='pt'?'en':'pt';try{localStorage.setItem('glp1-ui-language',lang);}catch(_){}render();break;
   case 'mode':state=E.transition(state,'mode',control.dataset.value);render();if(control.id!=='tab-plan'&&control.id!=='tab-day')$('tab-'+state.mode).scrollIntoView({behavior:'auto',block:'start'});break;
   case 'fasting-population':if(['adult','child'].includes(control.dataset.value)){fastingPopulation=control.dataset.value;render();}break;
   case 'source':sourceDialog();break;
   case 'reset':resetDialog();break;
   case 'confirm-reset':fastingPopulation='adult';state=E.initialState();closeDialog();render();window.scrollTo({top:0,behavior:'auto'});$('elective-yes').focus({preventScroll:true});showToast(t('Nova avaliação. As duas etapas foram limpas.','New assessment. Both stages were cleared.'));break;
   case 'close-dialog':closeDialog();break;
   case 'copy':void copy();break;
   case 'print':updatePrint();window.print();break;
   case 'result':scrollToResult();break;
  }
 }catch(error){failSafe(error);}
});
$('infoDialog').addEventListener('click',event=>{if(event.target===$('infoDialog')){const r=$('infoDialog').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();}});
window.addEventListener('beforeprint',updatePrint);
// Read-only inspection aids for regression tests; no setters or persistence hooks.
window.GLP1App=Object.freeze({getState:()=>JSON.parse(JSON.stringify(state)),getDecision:()=>E.evaluate(state),summaryText,render,source:SOURCE,getReferenceView:()=>fastingPopulation});
try{render();}catch(error){failSafe(error);}
})();
</script>
</body>
</html>
